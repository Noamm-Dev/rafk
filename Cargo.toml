[package]
name = "rafk"
version = "0.1.0"
edition = "2024"
description = "Headless Minecraft 1.8.9 AFK client for Hypixel Limbo"

[dependencies]
aes = "0.8"
anyhow = "1"
cfb8 = "0.8"
flate2 = "1"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "sync", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
